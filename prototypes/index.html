<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minimal site prototypes — João A. Leite</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #171717;
        background: #f2f1ed;
        font-family: Arial, Helvetica, sans-serif;
      }

      header {
        max-width: 1500px;
        margin: 0 auto;
        padding: 40px 28px 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 4rem);
        font-weight: 500;
        letter-spacing: -0.05em;
      }

      header p {
        max-width: 660px;
        margin: 0;
        color: #656565;
        line-height: 1.5;
      }

      main {
        display: grid;
        grid-template-columns: repeat(3, minmax(280px, 1fr));
        gap: 20px;
        max-width: 1500px;
        margin: 0 auto;
        padding: 16px 28px 40px;
      }

      article {
        min-width: 0;
      }

      .label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
      }

      h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      a {
        color: inherit;
        font-size: 0.8rem;
        text-underline-offset: 3px;
      }

      iframe {
        width: 100%;
        height: 720px;
        border: 1px solid #d2d0ca;
        background: white;
      }

      @media (max-width: 1050px) {
        main {
          grid-template-columns: 1fr;
        }

        iframe {
          height: 780px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Three quiet directions.</h1>
      <p>
        These are disposable visual studies, not a migration. Compare the hierarchy,
        density, typography, and use of your photograph before choosing a structure.
      </p>
    </header>

    <main>
      <article>
        <div class="label">
          <h2>01 — Typography-first</h2>
          <a href="01-typography.html" target="_blank">Open full size</a>
        </div>
        <iframe src="01-typography.html" title="Typography-first prototype"></iframe>
      </article>

      <article>
        <div class="label">
          <h2>02 — Academic index</h2>
          <a href="02-index.html" target="_blank">Open full size</a>
        </div>
        <iframe src="02-index.html" title="Academic index prototype"></iframe>
      </article>

      <article>
        <div class="label">
          <h2>03 — Editorial</h2>
          <a href="03-editorial.html" target="_blank">Open full size</a>
        </div>
        <iframe src="03-editorial.html" title="Editorial prototype"></iframe>
      </article>
    </main>
  </body>
</html>
